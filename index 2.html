<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#030300">
<title>Universo de Flores</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020300;color:#fff}
body{font-family:Georgia,serif}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#ui{position:fixed;inset:0;z-index:3;pointer-events:none}
#title{position:absolute;top:7%;width:100%;text-align:center;opacity:0;animation:show 2.4s 1.2s forwards}
#title small{font:600 10px Arial,sans-serif;letter-spacing:6px;color:#ffe878}
#title h1{margin:8px 0 0;font-size:clamp(32px,9vw,72px);font-weight:500;color:#fff7bd;text-shadow:0 0 8px #fff,0 0 22px #ffe100,0 0 50px #dca800}
.phrase{position:absolute;color:#fff8cf;text-shadow:0 0 7px #fff,0 0 16px #ffc800;font-size:clamp(11px,2.8vw,18px);opacity:.9;animation:float 4s ease-in-out infinite}
.p1{left:6%;top:37%}.p2{right:5%;top:43%;animation-delay:-1s}.p3{left:9%;top:65%;animation-delay:-2s}.p4{right:8%;top:70%;animation-delay:-3s}
#love{position:absolute;left:50%;top:58%;transform:translateX(-50%);white-space:nowrap;font-size:clamp(24px,7vw,52px);color:#fff7bd;text-shadow:0 0 9px #fff,0 0 25px #ffd400;animation:pulse 2.2s infinite}
#hint{position:absolute;bottom:max(18px,env(safe-area-inset-bottom));width:100%;text-align:center;font:11px Arial,sans-serif;letter-spacing:1.5px;color:#ffe56d;opacity:.6}
#start{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 45%,#3b3000 0,#0c0b00 38%,#010200 78%);transition:.9s}
#start.hide{opacity:0;visibility:hidden}
.card{text-align:center;padding:36px 25px;max-width:460px;border:1px solid #ffe35a55;border-radius:30px;background:#17140088;box-shadow:0 0 70px #e8bd0020;backdrop-filter:blur(10px)}
.card .sun{font-size:64px;filter:drop-shadow(0 0 18px #ffd000);animation:float 2.5s infinite}
.card h2{font-size:clamp(30px,8vw,52px);margin:10px 0;color:#fff6ae;text-shadow:0 0 20px #e7b900}
.card p{font:15px/1.55 Arial,sans-serif;color:#fff3c7}
button{pointer-events:auto;margin-top:22px;border:0;border-radius:999px;padding:14px 25px;font-weight:800;background:linear-gradient(135deg,#fff4a0,#ffc400);color:#3b2900;box-shadow:0 0 28px #ffd00077;font-size:16px}
.burst{position:fixed;z-index:20;pointer-events:none;font-size:22px;animation:burst 1.5s ease-out forwards}
@keyframes show{to{opacity:1}}@keyframes float{50%{transform:translateY(-12px)}}@keyframes pulse{50%{transform:translateX(-50%) scale(1.09)}}
@keyframes burst{to{transform:translate(var(--x),var(--y)) rotate(var(--r)) scale(1.3);opacity:0}}
@media(max-width:600px){.p1{top:39%}.p2{top:45%}.p3{top:72%}.p4{top:76%}#love{top:62%}}
</style>
</head>
<body>
<canvas id="space"></canvas>
<div id="ui">
  <div id="title"><small>NUESTRO PEQUEÑO UNIVERSO</small><h1>Para Ti ✨</h1></div>
  <div class="phrase p1">Eres mi sol 🌻</div>
  <div class="phrase p2">Me encantas ✨</div>
  <div class="phrase p3">Siempre juntos 💛</div>
  <div class="phrase p4">Amor de mi vida 🌼</div>
  <div id="love">Mi Amor 💛</div>
  <div id="hint">Toca la galaxia ✨</div>
</div>
<div id="start">
 <div class="card">
  <div class="sun">🌻</div>
  <h2>Una galaxia para ti</h2>
  <p>Hay millones de luces en el universo, pero ninguna brilla para mí como tú.</p>
  <button id="go">Entrar al universo 💛</button>
 </div>
</div>
<script>
const c=document.getElementById('space'),x=c.getContext('2d');
let W,H,D=1,t=0,running=false;
const stars=[], dust=[], flowers=[], heart=[];
function size(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;c.style.width=W+'px';c.style.height=H+'px';x.setTransform(D,0,0,D,0,0)}
addEventListener('resize',size);size();
const rnd=(a,b)=>a+Math.random()*(b-a);
for(let i=0;i<420;i++)stars.push({x:rnd(-1,1),y:rnd(-1,1),z:rnd(.15,1),s:rnd(.3,1.8),tw:rnd(0,6.28)});
for(let i=0;i<900;i++){let a=rnd(0,Math.PI*2),rad=Math.pow(Math.random(),.55)*1.25;dust.push({a,rad,z:rnd(.05,1),s:rnd(.4,2.2),tw:rnd(0,6.28)})}
for(let i=0;i<36;i++)flowers.push({a:rnd(0,Math.PI*2),rad:rnd(.22,1.05),z:rnd(.2,.95),s:rnd(13,29),spin:rnd(-.3,.3)});
for(let i=0;i<260;i++){let u=rnd(0,Math.PI*2),hx=16*Math.sin(u)**3,hy=-(13*Math.cos(u)-5*Math.cos(2*u)-2*Math.cos(3*u)-Math.cos(4*u));heart.push({x:hx/18,y:hy/18,j:rnd(-.025,.025),s:rnd(.8,2.2),tw:rnd(0,6.28)})}
function glow(px,py,r,a='#ffd800'){let g=x.createRadialGradient(px,py,0,px,py,r);g.addColorStop(0,'#fffbd0');g.addColorStop(.08,a);g.addColorStop(.35,'#dca80055');g.addColorStop(1,'#0000');x.fillStyle=g;x.beginPath();x.arc(px,py,r,0,7);x.fill()}
function draw(){
 t+=.006;x.fillStyle='#010200';x.fillRect(0,0,W,H);
 let cx=W/2,cy=H*.54,scale=Math.min(W,H)*.46;
 // deep stars
 for(const s of stars){let k=.45+s.z*.75,px=cx+s.x*W*k,py=H*.45+s.y*H*k;let a=.2+.7*(.5+.5*Math.sin(t*5+s.tw));x.fillStyle=`rgba(255,244,170,${a})`;x.fillRect(px,py,s.s,s.s)}
 // galaxy arms / floor
 x.save();x.globalCompositeOperation='lighter';
 for(const p of dust){let ang=p.a+t*(.55+p.z*.2)+p.rad*4.4;let squash=.34+.15*p.z;let rr=p.rad*scale*(.72+p.z*.45);let px=cx+Math.cos(ang)*rr;let py=cy+Math.sin(ang)*rr*squash+(p.z-.5)*H*.2;let a=.12+.65*p.z*(.6+.4*Math.sin(t*7+p.tw));x.fillStyle=`rgba(255,215,35,${a})`;x.beginPath();x.arc(px,py,p.s*(.5+p.z),0,7);x.fill()}
 glow(cx,cy,Math.min(W,H)*.16,'#fff04a');
 // central rings
 for(let q=0;q<5;q++){x.strokeStyle=`rgba(255,221,55,${.22-q*.03})`;x.lineWidth=1.2;x.beginPath();x.ellipse(cx,cy,scale*(.15+q*.045),scale*(.035+q*.012),t*2,0,7);x.stroke()}
 // flowers as orbiting worlds
 x.font='20px serif';x.textAlign='center';x.textBaseline='middle';
 for(const f of flowers){let a=f.a+t*(.18+f.z*.08);let rr=f.rad*scale;let px=cx+Math.cos(a)*rr,py=cy+Math.sin(a)*rr*.39+(f.z-.5)*H*.16;let sz=f.s*(.55+f.z*.75);x.font=sz+'px serif';x.globalAlpha=.45+.55*f.z;x.shadowBlur=12;x.shadowColor='#ffd000';x.fillText(Math.random()<.985?'🌻':'🌼',px,py)}
 x.shadowBlur=0;x.globalAlpha=1;
 // particle heart
 let heartY=H*.29,hs=Math.min(W,H)*.13;
 for(const p of heart){let px=cx+(p.x+p.j)*hs,py=heartY+(p.y+p.j)*hs;let a=.35+.65*(.5+.5*Math.sin(t*8+p.tw));x.fillStyle=`rgba(255,235,80,${a})`;x.beginPath();x.arc(px,py,p.s,0,7);x.fill()}
 x.restore();
 requestAnimationFrame(draw)
}draw();
function burst(px,py,n=18){const ar=['🌻','✨','💛','🌼'];for(let i=0;i<n;i++){let e=document.createElement('span'),a=Math.random()*6.28,d=rnd(50,145);e.className='burst';e.textContent=ar[i%ar.length];e.style.left=px+'px';e.style.top=py+'px';e.style.setProperty('--x',Math.cos(a)*d+'px');e.style.setProperty('--y',Math.sin(a)*d+'px');e.style.setProperty('--r',rnd(-360,360)+'deg');document.body.append(e);setTimeout(()=>e.remove(),1500)}}
document.getElementById('go').onclick=e=>{document.getElementById('start').classList.add('hide');burst(W/2,H/2,30);running=true};
addEventListener('pointerdown',e=>{if(running)burst(e.clientX,e.clientY)});
</script>
</body>
</html>
